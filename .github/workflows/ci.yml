# Caller of the shared-ci fail-closed quality gate. Every lane runs the same
# entry as .githooks/pre-push (scripts/verify); `quality / aggregate` is the
# quality check the ruleset needs to require.
#   verify   scripts/verify --policy     contract audit + workflow-lint via the verify entry
#   build    SwiftSDK layer (macOS 26)   swift build + swift test on the root package
#   test     WebSDK, PythonSDK, ProjectAnalyzer layers
#            npm ci + typecheck + vitest run + tsup build; pytest for both Python trees
# The Stack layer (Docker Compose + Grafana assets) has no automated gate.
# Codex review runs separately in review.yml on this repository's self-hosted runner.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: LeePepe/shared-ci/.github/workflows/quality.yml@6e354f476bc53d68f0f09fc231d5cd938466af9c
    with:
      runs-on: ubuntu-latest
      setup-command: scripts/ci/setup.sh
      verify-command: scripts/verify --policy
      build-command: scripts/verify --layer SwiftSDK && python3 sdks/swift/scripts/external_consumer.py --revision "$(git rev-parse HEAD)"
      build-runs-on: macos-26
      test-command: scripts/verify --layer WebSDK --layer PythonSDK --layer ProjectAnalyzer
      contract-audit: true
      workflow-lint: true
