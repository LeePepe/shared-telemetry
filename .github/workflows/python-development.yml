name: Python SDK development

# Authoring only; publication of this push-triggered file requires separate approval.
# Repository 1213460359: accepted LokiKit -> LeePepe/shared-telemetry rename.
# r3 JSONL SHA256: ee96844d04d65aa4b9109e0bda2e4b68f88b4f5be120a17657122ac8db98b0cb
# Wheel hashes are metadata claims until acquisition verifies actual bytes.
on:
  push:
    branches: [upgrade/python-sdk-development-20260924]

permissions: {}

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Admit existing runtime and record runner tools
        id: admission
        env:
          TASK_ROOT: ${{ runner.temp }}/python-development-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir "$TASK_ROOT"
          mkdir "$TASK_ROOT/evidence" "$TASK_ROOT/wheels" "$TASK_ROOT/tmp"
          env -i PATH=/usr/bin:/bin TASK_ROOT="$TASK_ROOT" PIP_CONFIG_FILE=/dev/null \
            IMAGE_OS="$ImageOS" IMAGE_VERSION="$ImageVersion" \
            RUNNER_NAME="$RUNNER_NAME" RUNNER_ARCH="$RUNNER_ARCH" \
            /usr/bin/python3.12 -I -S -B - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys, sysconfig
          root = pathlib.Path(os.environ["TASK_ROOT"])
          def command(*args):
              return subprocess.check_output(args, text=True, timeout=15).strip()
          identity = {
              "executable": sys.executable, "resolved_executable": str(pathlib.Path(sys.executable).resolve()),
              "executable_sha256": hashlib.sha256(pathlib.Path(sys.executable).read_bytes()).hexdigest(),
              "python": sys.version, "implementation": platform.python_implementation(),
              "system": platform.system(), "machine": platform.machine(), "libc": platform.libc_ver(),
              "soabi": sysconfig.get_config_var("SOABI"), "os_release": platform.freedesktop_os_release(),
              "runner": {k: os.environ[k] for k in ("IMAGE_OS", "IMAGE_VERSION", "RUNNER_NAME", "RUNNER_ARCH")},
              "git": command("/usr/bin/git", "--version"), "curl": command("/usr/bin/curl", "--version"),
          }
          print(json.dumps(identity), flush=True)
          (root / "evidence/runtime.json").write_text(json.dumps(identity, indent=2) + "\n")
          assert identity["implementation"] == "CPython" and sys.version_info[:3] == (3, 12, 3)
          assert (identity["system"], identity["machine"], identity["libc"]) == ("Linux", "x86_64", ("glibc", "2.39"))
          assert identity["soabi"] == "cpython-312-x86_64-linux-gnu"
          assert identity["os_release"]["ID"] == "ubuntu" and identity["os_release"]["VERSION_ID"] == "24.04"
          # Observe the existing ordinary installer; never bootstrap or upgrade it.
          pip = command(sys.executable, "-I", "-B", "-m", "pip", "--isolated", "--version")
          print(pip, flush=True)
          (root / "evidence/pip-identity.json").write_text(json.dumps({"command": "/usr/bin/python3.12 -I -B -m pip", "identity": pip}) + "\n")
          PY

      - name: Acquire exact immutable source without credentials
        id: source
        env:
          TASK_ROOT: ${{ runner.temp }}/python-development-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          env -i PATH=/usr/bin:/bin TASK_ROOT="$TASK_ROOT" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
          /bin/bash --noprofile --norc -euo pipefail <<'SH'
          umask 022
          cd "$TASK_ROOT"
          git init --template= source
          cd source
          timeout 120 git -c credential.helper= -c http.followRedirects=false \
            -c protocol.allow=never -c protocol.https.allow=always \
            fetch --depth=1 --no-tags --no-recurse-submodules \
            https://github.com/LeePepe/shared-telemetry.git \
            852d7643bbb2c4fbed38018196a1a5c2c225e223
          test "$(git rev-parse FETCH_HEAD)" = 852d7643bbb2c4fbed38018196a1a5c2c225e223
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = b4b25c68efa09cd87f17a45d5d4a21bf0fa143f5
          git ls-tree -r FETCH_HEAD > "$TASK_ROOT/evidence/source-tree.txt"
          /usr/bin/python3.12 -I -S -B - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["TASK_ROOT"])
          rows = (root / "evidence/source-tree.txt").read_text().splitlines()
          assert len(rows) == 77
          for row in rows:
              entry, name = row.split("\t")
              mode, kind, blob = entry.split()
              assert mode in ("100644", "100755") and kind == "blob"
              assert pathlib.PurePosixPath(name).name not in (".gitattributes", ".gitmodules")
          assert not list((root / "source/.git/hooks").glob("*"))
          assert not (root / "source/.git/info/attributes").exists()
          PY
          git -c core.autocrlf=false -c core.filemode=true -c core.hooksPath=/dev/null \
            checkout --detach FETCH_HEAD
          /usr/bin/python3.12 -I -S -B - <<'PY'
          import hashlib, json, os, pathlib, stat
          root = pathlib.Path(os.environ["TASK_ROOT"])
          inventory = []
          for row in (root / "evidence/source-tree.txt").read_text().splitlines():
              entry, name = row.split("\t")
              mode, kind, blob = entry.split()
              p = root / "source" / name
              data = p.read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert not p.is_symlink() and actual == blob
              assert stat.S_IMODE(p.stat().st_mode) == (int(mode, 8) & 0o777)
              inventory.append({"path": name, "mode": mode, "blob": blob, "bytes": len(data),
                                "sha256": hashlib.sha256(data).hexdigest()})
          receipt = {"commit": "852d7643bbb2c4fbed38018196a1a5c2c225e223",
                     "tree": "b4b25c68efa09cd87f17a45d5d4a21bf0fa143f5", "files": inventory}
          (root / "evidence/source-before.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt), flush=True)
          PY
          SH

