      - name: Ordinary offline installation and installed closure verification
        id: installation
        env:
          TASK_ROOT: ${{ runner.temp }}/python-development-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          env -i PATH=/usr/bin:/bin TMPDIR="$TASK_ROOT/tmp" \
            PIP_CONFIG_FILE=/dev/null PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3.12 -I -B -m pip --isolated --disable-pip-version-check --no-cache-dir \
            install --no-index --find-links "$TASK_ROOT/wheels" --only-binary=:all: \
            --no-deps --require-hashes --ignore-installed --no-compile \
            --target "$TASK_ROOT/dependencies" --report "$TASK_ROOT/evidence/install.json" \
            -r "$TASK_ROOT/requirements.lock"
          env -i PATH=/usr/bin:/bin TASK_ROOT="$TASK_ROOT" /usr/bin/python3.12 -I -S -B - <<'PY'
          import hashlib, importlib.metadata, json, os, pathlib, sys, tomllib
          root = pathlib.Path(os.environ["TASK_ROOT"])
          target = root / "dependencies"
          assert not any("site-packages" in p or "dist-packages" in p for p in sys.path)
          sys.path.insert(0, str(target))
          from packaging.markers import default_environment
          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet
          from packaging.tags import sys_tags
          from packaging.utils import canonicalize_name, parse_wheel_filename
          rows = json.loads((root / "lock.json").read_text())
          pins = {r["name"]: r["version"] for r in rows}
          distributions = list(importlib.metadata.distributions(path=[str(target)]))
          installed = {canonicalize_name(d.metadata["Name"]): d for d in distributions}
          assert len(distributions) == len(installed) == 16 and installed.keys() == pins.keys()
          environment = default_environment() | {"extra": ""}
          tags = set(sys_tags())
          active, excluded, receipt = [], [], []
          def requirement(text, parent):
              req = Requirement(text)
              assert not req.url and not req.extras
              applies = req.marker is None or req.marker.evaluate(environment)
              (active if applies else excluded).append({"parent": parent, "requirement": text})
              if applies:
                  assert canonicalize_name(req.name) in pins
                  assert pins[canonicalize_name(req.name)] in req.specifier
          for row in rows:
              dist = installed[row["name"]]
              assert dist.version == row["version"]
              assert sorted(map(str, map(Requirement, dist.requires or []))) == sorted(map(str, map(Requirement, row["requires_dist"])))
              assert SpecifierSet(dist.metadata["Requires-Python"]) == SpecifierSet(row["requires_python"])
              assert environment["python_full_version"] in SpecifierSet(row["wheel"]["requires_python"])
              assert environment["python_full_version"] in SpecifierSet(dist.metadata["Requires-Python"])
              name, version, build, wheel_tags = parse_wheel_filename(row["wheel"]["filename"])
              assert name == row["name"] and str(version) == row["version"] and wheel_tags & tags
              for text in dist.requires or []:
                  requirement(text, row["name"])
              metadata_files = [f for f in dist.files if str(f).endswith(".dist-info/METADATA")]
              assert len(metadata_files) == 1
              path = pathlib.Path(dist.locate_file(metadata_files[0])).resolve()
              assert path.is_relative_to(target)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              wheel = next(w for w in json.loads((root / "evidence/wheels.json").read_text()) if w["name"] == row["name"])
              assert digest == wheel["metadata_sha256"]
              receipt.append({"name": row["name"], "version": dist.version, "metadata_path": str(path),
                              "metadata_sha256": digest, "requires_dist": dist.requires or [],
                              "requires_python": dist.metadata["Requires-Python"]})
          assert len(active) == 19 and len(excluded) == 34
          project = tomllib.loads((root / "source/sdks/python/pyproject.toml").read_text())["project"]
          roots = project["dependencies"] + project["optional-dependencies"]["dev"]
          for text in roots:
              requirement(text, "ROOT")
          result = {"installed": receipt, "active_including_roots": active, "excluded": excluded,
                    "marker_environment": environment, "sys_path": sys.path}
          (root / "evidence/installed-closure.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result), flush=True)
          PY

      - name: Collect and run only the unchanged synthetic SDK suite
        id: tests
        env:
          TASK_ROOT: ${{ runner.temp }}/python-development-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Existing fakes/socket backstops are not OS-level egress isolation.
          env -i PATH=/usr/bin:/bin TASK_ROOT="$TASK_ROOT" TMPDIR="$TASK_ROOT/tmp" \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3.12 -I -S -B - <<'PY'
          import json, os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["TASK_ROOT"])
          source = root / "source"
          expected = [
              "sdks/python/tests/test_client.py::test_build_body",
              "sdks/python/tests/test_client.py::test_success_preserves_wire_body_and_headers[False]",
              "sdks/python/tests/test_client.py::test_success_preserves_wire_body_and_headers[True]",
              "sdks/python/tests/test_client.py::test_empty_flush_close_and_counter_read_have_no_side_effects",
              "sdks/python/tests/test_client.py::test_sync_failures_count_once_without_retry[connection]",
              "sdks/python/tests/test_client.py::test_sync_failures_count_once_without_retry[timeout]",
              "sdks/python/tests/test_client.py::test_sync_failures_count_once_without_retry[401]",
              "sdks/python/tests/test_client.py::test_sync_failures_count_once_without_retry[500]",
              "sdks/python/tests/test_client.py::test_async_failures_count_once_and_propagate[connection]",
              "sdks/python/tests/test_client.py::test_async_failures_count_once_and_propagate[timeout]",
              "sdks/python/tests/test_client.py::test_async_failures_count_once_and_propagate[401]",
              "sdks/python/tests/test_client.py::test_async_failures_count_once_and_propagate[500]",
              "sdks/python/tests/test_client.py::test_cumulative_losses_survive_later_success[False]",
              "sdks/python/tests/test_client.py::test_cumulative_losses_survive_later_success[True]",
              "sdks/python/tests/test_client.py::test_sync_flush_paths_account_consistently[False-batch]",
              "sdks/python/tests/test_client.py::test_sync_flush_paths_account_consistently[False-explicit]",
              "sdks/python/tests/test_client.py::test_sync_flush_paths_account_consistently[False-timer]",
              "sdks/python/tests/test_client.py::test_sync_flush_paths_account_consistently[False-close]",
              "sdks/python/tests/test_client.py::test_sync_flush_paths_account_consistently[True-batch]",
              "sdks/python/tests/test_client.py::test_sync_flush_paths_account_consistently[True-explicit]",
              "sdks/python/tests/test_client.py::test_sync_flush_paths_account_consistently[True-timer]",
              "sdks/python/tests/test_client.py::test_sync_flush_paths_account_consistently[True-close]",
              "sdks/python/tests/test_client.py::test_sync_base_exception_is_not_newly_suppressed",
              "sdks/python/tests/test_client.py::test_default_batch_trigger_remains_twenty",
              "sdks/python/tests/test_client.py::test_apush_still_uses_sync_batch_flush",
              "sdks/python/tests/test_client.py::test_sync_preparation_errors_count_and_still_propagate[body]",
              "sdks/python/tests/test_client.py::test_sync_preparation_errors_count_and_still_propagate[serialization]",
              "sdks/python/tests/test_client.py::test_sync_preparation_errors_count_and_still_propagate[request]",
              "sdks/python/tests/test_client.py::test_sync_preparation_errors_count_and_still_propagate[header]",
              "sdks/python/tests/test_client.py::test_async_preparation_errors_count_and_still_propagate[body]",
              "sdks/python/tests/test_client.py::test_async_preparation_errors_count_and_still_propagate[timeout]",
              "sdks/python/tests/test_client.py::test_async_preparation_errors_count_and_still_propagate[session]",
              "sdks/python/tests/test_client.py::test_async_preparation_errors_count_and_still_propagate[session_entry]",
              "sdks/python/tests/test_client.py::test_async_preparation_errors_count_and_still_propagate[post]",
              "sdks/python/tests/test_client.py::test_inflight_async_batch_does_not_consume_new_entries[False]",
              "sdks/python/tests/test_client.py::test_inflight_async_batch_does_not_consume_new_entries[True]",
              "sdks/python/tests/test_client.py::test_concurrent_async_and_sync_failures_do_not_lose_increments",
              "sdks/python/tests/test_client.py::test_socket_backstop_denies_connections_and_dns",
              "sdks/python/tests/test_handler.py::TestLokiHandler::test_handler_emits_json",
              "sdks/python/tests/test_handler.py::TestLokiHandler::test_handler_extra_fields",
              "sdks/python/tests/test_handler.py::TestLokiHandler::test_handler_flush_and_close",
              "sdks/python/tests/test_handler.py::TestLokiHandler::test_format_record_structure",
          ]
          # -I -S excludes user/site packages, .pth, startup customization and cwd.
          # Add only the genuine installed target and immutable SDK source.
          bootstrap = (
              "import importlib.util,json,pathlib,runpy,sys;"
              "assert not any('site-packages' in p or 'dist-packages' in p for p in sys.path);"
              f"sys.path[:0]={[str(root / 'dependencies'), str(source / 'sdks/python/src')]!r};"
              "origins={n:importlib.util.find_spec(n).origin for n in ('pytest','aiohttp','lokikit')};"
              f"assert all(pathlib.Path(origins[n]).is_relative_to({str(root / 'dependencies')!r}) for n in ('pytest','aiohttp'));"
              f"assert pathlib.Path(origins['lokikit']).is_relative_to({str(source / 'sdks/python/src')!r});"
              "print('IMPORT_ORIGINS '+json.dumps(origins),flush=True);"
              "print('ISOLATED_SYS_PATH '+json.dumps(sys.path),flush=True);"
              "runpy.run_module('pytest',run_name='__main__')"
          )
          base = [sys.executable, "-I", "-S", "-B", "-c", bootstrap,
                  "-c", str(source / "sdks/python/pyproject.toml"), "--rootdir", str(source),
                  "--import-mode=importlib", "-p", "no:cacheprovider", "--color=no",
                  "-W", "always", "-o", "xfail_strict=true", "sdks/python/tests"]
          collected = subprocess.run(base + ["--collect-only", "-q"], cwd=source,
                                     text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
          (root / "evidence/collection.log").write_text(collected.stdout)
          print(collected.stdout, end="", flush=True)
          nodes = [s.strip() for s in collected.stdout.splitlines() if s.startswith("sdks/python/tests/") and "::" in s]
          receipt = {"exit": collected.returncode, "nodeids": nodes, "expected": expected,
                     "matches": len(nodes) == len(set(nodes)) == 42 and set(nodes) == set(expected)}
          (root / "evidence/collection.json").write_text(json.dumps(receipt, indent=2) + "\n")
          collected.check_returncode()
          assert receipt["matches"], "collection differs from the fixed 42 cases"
          # Stream normal pytest output; JUnit retains individual results on failure.
          result = subprocess.run(base + ["-x", "-vv", "-rA", "--capture=tee-sys",
                                         "--junitxml", str(root / "evidence/tests.xml"),
                                         "-o", "junit_logging=all", "-o", "junit_log_passing_tests=true"],
                                  cwd=source, timeout=300)
          (root / "evidence/test-exit.json").write_text(json.dumps({"exit": result.returncode}) + "\n")
          result.check_returncode()
          cases = ET.parse(root / "evidence/tests.xml").findall(".//testcase")
          wanted = set()
          for node in expected:
              path, *parts = node.split("::")
              wanted.add((".".join([path[:-3].replace("/", "."), *parts[:-1]]), parts[-1]))
          actual = {(case.get("classname"), case.get("name")) for case in cases}
          assert len(cases) == len(actual) == 42 and actual == wanted
          assert not any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error"))
          (root / "evidence/results.json").write_text(json.dumps({"cases": 42, "nodeids": nodes, "all_passed": True}) + "\n")
          PY

      - name: Always report phase outcomes, complete evidence and source preservation
        id: evidence
        if: ${{ always() }}
        env:
          TASK_ROOT: ${{ runner.temp }}/python-development-${{ github.run_id }}-${{ github.run_attempt }}
          ADMISSION: ${{ steps.admission.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          ACQUISITION: ${{ steps.acquisition.outcome }}
          INSTALLATION: ${{ steps.installation.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          env -i PATH=/usr/bin:/bin TASK_ROOT="$TASK_ROOT" \
            ADMISSION="$ADMISSION" SOURCE="$SOURCE" ACQUISITION="$ACQUISITION" \
            INSTALLATION="$INSTALLATION" TESTS="$TESTS" \
            /usr/bin/python3.12 -I -S -B - <<'PY'
          import hashlib, json, os, pathlib, stat
          root = pathlib.Path(os.environ["TASK_ROOT"])
          outcomes = {k.lower(): os.environ[k] for k in ("ADMISSION", "SOURCE", "ACQUISITION", "INSTALLATION", "TESTS")}
          print("PHASE_OUTCOMES " + json.dumps(outcomes), flush=True)
          evidence = root / "evidence"
          # Print full retained records even when an earlier stage fails.
          for p in sorted(evidence.glob("*")):
              print(f"--- {p.name} sha256={hashlib.sha256(p.read_bytes()).hexdigest()} ---", flush=True)
              print(p.read_text(), flush=True)
          before = evidence / "source-before.json"
          if before.exists():
              receipt = json.loads(before.read_text())
              changes = []
              for entry in receipt["files"]:
                  p = root / "source" / entry["path"]
                  if not p.is_file() or p.is_symlink():
                      changes.append(entry["path"])
                      continue
                  if (hashlib.sha256(p.read_bytes()).hexdigest() != entry["sha256"]
                          or stat.S_IMODE(p.stat().st_mode) != (int(entry["mode"], 8) & 0o777)):
                      changes.append(entry["path"])
              actual = {str(p.relative_to(root / "source")) for p in (root / "source").rglob("*")
                        if ".git" not in p.relative_to(root / "source").parts and (not p.is_dir() or p.is_symlink())}
              expected = {entry["path"] for entry in receipt["files"]}
              preservation = {"commit": receipt["commit"], "tree": receipt["tree"], "files": len(expected),
                              "changed": changes, "extra": sorted(actual - expected), "missing": sorted(expected - actual)}
              print("SOURCE_PRESERVATION " + json.dumps(preservation), flush=True)
              (evidence / "source-after.json").write_text(json.dumps(preservation, indent=2) + "\n")
              assert not changes and actual == expected, "source preservation failure"
          else:
              print('SOURCE_PRESERVATION {"status":"not_available_before_source_acquisition_completed"}', flush=True)
          if all(value == "success" for value in outcomes.values()):
              required = ("runtime.json", "pip-identity.json", "source-tree.txt", "source-before.json",
                          "wheels.json", "install.json", "installed-closure.json", "collection.log",
                          "collection.json", "test-exit.json", "tests.xml", "results.json", "source-after.json")
              assert all((evidence / name).is_file() for name in required), "incomplete evidence"
          print("Bounded synthetic SDK evidence only; not OS egress, real transport, packaging-consumer, vulnerability, or D1/R0/6DQ certification.", flush=True)
          print('EVIDENCE_REPORT {"status":"complete","storage":"GitHub job logs; no artifact upload"}', flush=True)
          PY
