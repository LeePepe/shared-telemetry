{
  "name": "Web image metadata (source-authorized lookup)",
  "on": {
    "push": {
      "branches": [
        "diag/web-image-metadata-20260924"
      ]
    }
  },
  "permissions": {},
  "jobs": {
    "metadata": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 4,
      "permissions": {},
      "steps": [
        {
          "name": "Resolve public Node image metadata only",
          "shell": "bash",
          "run": "exec /usr/bin/python3 -I - <<'PY'\nimport hashlib\nimport json\nimport os\nimport re\nimport selectors\nimport signal\nimport subprocess\nimport time\n\n# Public metadata only: reject all redirects; never request config/layer blobs.\n# No CDN is guessed or allowlisted. Authorization can never cross hosts.\nREGISTRY = \"https://registry-1.docker.io/v2/library/node/manifests/\"\nTAG_URL = REGISTRY + \"22-bookworm-slim\"\nAUTH_URL = (\"https://auth.docker.io/token?service=registry.docker.io\"\n            \"&scope=repository%3Alibrary%2Fnode%3Apull\")\nINDEX_TYPES = {\n    \"application/vnd.oci.image.index.v1+json\",\n    \"application/vnd.docker.distribution.manifest.list.v2+json\",\n}\nMANIFEST_TYPES = {\n    \"application/vnd.oci.image.manifest.v1+json\",\n    \"application/vnd.docker.distribution.manifest.v2+json\",\n}\nCONFIG_TYPES = {\n    \"application/vnd.oci.image.config.v1+json\",\n    \"application/vnd.docker.container.image.v1+json\",\n}\nLAYER_TYPES = {\n    \"application/vnd.oci.image.layer.v1.tar\",\n    \"application/vnd.oci.image.layer.v1.tar+gzip\",\n    \"application/vnd.oci.image.layer.v1.tar+zstd\",\n    \"application/vnd.oci.image.layer.nondistributable.v1.tar\",\n    \"application/vnd.oci.image.layer.nondistributable.v1.tar+gzip\",\n    \"application/vnd.oci.image.layer.nondistributable.v1.tar+zstd\",\n    \"application/vnd.docker.image.rootfs.diff.tar.gzip\",\n    \"application/vnd.docker.image.rootfs.foreign.diff.tar.gzip\",\n}\nBODY_LIMIT = 2 * 1024 * 1024\nHEADER_LIMIT = 32 * 1024\nSTDERR_LIMIT = 4096\nMAX_GETS = 6\nphase = \"setup\"\nrequests = 0\nlinkage = {}\ndeadline = time.monotonic() + 140\n\n\nclass Rejected(Exception):\n    pass\n\n\ndef require(condition, code):\n    if not condition:\n        raise Rejected(code)\n\n\ndef emit(result, **fields):\n    # Only fixed labels, validated identifiers and integers enter output.\n    print(json.dumps(dict(scope=\"image_metadata_only\", phase=phase,\n                          result=result, requests=requests, **linkage, **fields),\n                     sort_keys=True, separators=(\",\", \":\")), flush=True)\n\n\ndef expired(signum, frame):\n    raise Rejected(\"outer_deadline\")\n\n\ndef pairs(items):\n    result = {}\n    for key, value in items:\n        require(key not in result, \"duplicate_json_key\")\n        result[key] = value\n    return result\n\n\ndef bad_constant(value):\n    raise Rejected(\"nonfinite_json\")\n\n\ndef parse_json(raw):\n    try:\n        value = json.loads(raw.decode(\"utf-8\"), object_pairs_hook=pairs,\n                           parse_constant=bad_constant)\n    except (ValueError, UnicodeError, RecursionError):\n        raise Rejected(\"invalid_json\") from None\n    require(isinstance(value, dict), \"json_object_required\")\n    return value\n\n\ndef digest(value):\n    require(isinstance(value, str) and\n            re.fullmatch(r\"sha256:[0-9a-f]{64}\", value) is not None,\n            \"invalid_digest\")\n    return value\n\n\ndef descriptor(value, media_types, limit):\n    require(isinstance(value, dict), \"invalid_descriptor\")\n    digest(value.get(\"digest\"))\n    require(value.get(\"mediaType\") in media_types, \"descriptor_media_type\")\n    require(type(value.get(\"size\")) is int and 0 < value[\"size\"] <= limit,\n            \"descriptor_size\")\n    require(\"urls\" not in value and \"data\" not in value,\n            \"alternate_descriptor_source\")\n    return value\n\n\ndef quoted(value):\n    require(isinstance(value, str) and\n            all(32 <= ord(char) < 127 for char in value),\n            \"unsafe_curl_config\")\n    return '\"' + value.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"') + '\"'\n\n\ndef get(url, accept, bearer=None, body_limit=BODY_LIMIT):\n    global requests\n    # Only exact auth/tag/digest metadata endpoints may enter curl.\n    is_manifest = url == TAG_URL or (\n        url.startswith(REGISTRY) and\n        re.fullmatch(r\"sha256:[0-9a-f]{64}\", url[len(REGISTRY):]) is not None)\n    require(url == AUTH_URL or is_manifest, \"endpoint_not_allowed\")\n    require((url == AUTH_URL and bearer is None) or\n            (is_manifest and bearer is not None), \"authorization_scope\")\n    require(requests < MAX_GETS, \"request_budget\")\n    require(time.monotonic() < deadline, \"outer_deadline\")\n    options = [\n        \"silent\", \"show-error\", \"include\", \"http1.1\",\n        \"request = \" + quoted(\"GET\"),\n        \"proto = \" + quoted(\"=https\"),\n        \"proto-redir = \" + quoted(\"=https\"),\n        \"max-redirs = 0\", \"retry = 0\", \"connect-timeout = 10\",\n        \"max-time = 20\", \"max-filesize = \" + str(body_limit),\n        \"proxy = \" + quoted(\"\"), \"noproxy = \" + quoted(\"*\"),\n        \"url = \" + quoted(url),\n        \"header = \" + quoted(\"Accept: \" + accept),\n        \"header = \" + quoted(\"Accept-Encoding: identity\"),\n    ]\n    if bearer is not None:\n        options.append(\"header = \" + quoted(\"Authorization: Bearer \" + bearer))\n    payload = (\"\\n\".join(options) + \"\\n\").encode(\"ascii\")\n    require(len(payload) <= 32768, \"curl_config_size\")\n    requests += 1\n    proc = None\n    selector = selectors.DefaultSelector()\n    output = bytearray()\n    errors = bytearray()\n    header_end = None\n    sent = 0\n    request_deadline = min(deadline, time.monotonic() + 20)\n    try:\n        # -q MUST be first. No ambient HOME, proxy, token, CA override, curl\n        # configuration or credential environment is inherited.\n        # URL and Authorization stay in stdin-fed configuration / memory.\n        proc = subprocess.Popen(\n            [\"/usr/bin/curl\", \"-q\", \"--config\", \"-\"],\n            stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,\n            env={\"PATH\": \"/usr/bin:/bin\", \"LANG\": \"C\", \"LC_ALL\": \"C\"},\n            close_fds=True)\n        for stream, event in ((proc.stdin, selectors.EVENT_WRITE),\n                              (proc.stdout, selectors.EVENT_READ),\n                              (proc.stderr, selectors.EVENT_READ)):\n            os.set_blocking(stream.fileno(), False)\n            selector.register(stream, event)\n        while selector.get_map():\n            remaining = request_deadline - time.monotonic()\n            require(remaining > 0, \"request_deadline\")\n            for key, event in selector.select(min(remaining, 0.25)):\n                stream = key.fileobj\n                if stream is proc.stdin:\n                    try:\n                        sent += os.write(stream.fileno(), payload[sent:sent + 4096])\n                    except BrokenPipeError:\n                        raise Rejected(\"curl_input_closed\") from None\n                    if sent == len(payload):\n                        selector.unregister(stream)\n                        stream.close()\n                    continue\n                chunk = os.read(stream.fileno(), 4096)\n                if not chunk:\n                    selector.unregister(stream)\n                    stream.close()\n                    continue\n                if stream is proc.stderr:\n                    require(len(errors) + len(chunk) <= STDERR_LIMIT,\n                            \"stderr_size\")\n                    errors.extend(chunk)\n                    continue\n                require(len(output) + len(chunk) <=\n                        HEADER_LIMIT + 4 + body_limit, \"stdout_size\")\n                output.extend(chunk)\n                if header_end is None:\n                    marker = output.find(b\"\\r\\n\\r\\n\")\n                    if marker >= 0:\n                        require(marker <= HEADER_LIMIT, \"header_size\")\n                        header_end = marker + 4\n                    else:\n                        require(len(output) <= HEADER_LIMIT, \"header_size\")\n                if header_end is not None:\n                    require(len(output) - header_end <= body_limit, \"body_size\")\n        remaining = request_deadline - time.monotonic()\n        require(remaining > 0, \"request_deadline\")\n        try:\n            returncode = proc.wait(timeout=remaining)\n        except subprocess.TimeoutExpired:\n            raise Rejected(\"request_deadline\") from None\n        require(returncode == 0, \"curl_transport\")\n    finally:\n        selector.close()\n        if proc is not None:\n            if proc.poll() is None:\n                proc.kill()\n            proc.wait()\n            for stream in (proc.stdin, proc.stdout, proc.stderr):\n                if stream is not None and not stream.closed:\n                    stream.close()\n        # Never print raw stderr, including on failure.\n    require(header_end is not None, \"missing_http_headers\")\n    lines = bytes(output[:header_end - 4]).split(b\"\\r\\n\")\n    require(re.fullmatch(rb\"HTTP/1\\.[01] [0-9]{3}(?: [\\x20-\\x7e]*)?\",\n                         lines[0]) is not None, \"http_status_shape\")\n    status = int(lines[0].split(b\" \")[1])\n    # Fail closed before reading Location. Signed redirect URLs never enter\n    # logs, argv, files, or another request; no cross-host Authorization exists.\n    require(not 300 <= status < 400, \"redirect_not_allowed\")\n    require(status == 200, \"http_status_not_200\")\n    headers = {}\n    for line in lines[1:]:\n        name, separator, value = line.partition(b\":\")\n        require(separator == b\":\" and\n                re.fullmatch(rb\"[!#$%&'*+.^_`|~0-9A-Za-z-]+\", name) is not None,\n                \"invalid_http_header\")\n        require(all(char == 9 or 32 <= char < 127 for char in value),\n                \"invalid_header_value\")\n        name = name.decode(\"ascii\").lower()\n        value = value.strip().decode(\"ascii\")\n        require(name not in headers, \"duplicate_http_header\")\n        headers[name] = value\n    # curl removes HTTP chunk framing, not manifest bytes. Reject ambiguous\n    # framing; verify Content-Length when available, plus descriptor size below.\n    transfer = headers.get(\"transfer-encoding\")\n    length = headers.get(\"content-length\")\n    require(transfer is None or transfer.lower() == \"chunked\",\n            \"transfer_encoding_not_allowed\")\n    require(not (transfer is not None and length is not None),\n            \"ambiguous_http_framing\")\n    require(headers.get(\"content-encoding\", \"identity\") == \"identity\",\n            \"content_encoding_not_allowed\")\n    body = bytes(output[header_end:])\n    if length is not None:\n        require(re.fullmatch(r\"[0-9]{1,10}\", length) is not None and\n                int(length) == len(body), \"content_length_mismatch\")\n    require(len(body) > 0, \"empty_body\")\n    return body, headers\n\n\ndef manifest(raw, headers, media_types, expected=None):\n    actual_digest = \"sha256:\" + hashlib.sha256(raw).hexdigest()\n    declared_digest = digest(headers.get(\"docker-content-digest\"))\n    require(actual_digest == declared_digest, \"response_digest_mismatch\")\n    if expected is not None:\n        require(actual_digest == expected[\"digest\"], \"descriptor_digest_mismatch\")\n        require(len(raw) == expected[\"size\"], \"descriptor_size_mismatch\")\n    value = parse_json(raw)\n    require(type(value.get(\"schemaVersion\")) is int and\n            value[\"schemaVersion\"] == 2, \"schema_version\")\n    media_type = value.get(\"mediaType\")\n    require(media_type in media_types, \"manifest_media_type\")\n    require(headers.get(\"content-type\", \"\").split(\";\", 1)[0].strip() == media_type,\n            \"content_type_mismatch\")\n    if expected is not None:\n        require(media_type == expected[\"mediaType\"], \"descriptor_type_mismatch\")\n    return value, actual_digest\n\n\ndef main():\n    global phase, linkage\n    run_id = os.environ.get(\"GITHUB_RUN_ID\", \"\")\n    attempt = os.environ.get(\"GITHUB_RUN_ATTEMPT\", \"\")\n    head = os.environ.get(\"GITHUB_SHA\", \"\")\n    workflow_head = os.environ.get(\"GITHUB_WORKFLOW_SHA\", \"\")\n    require(re.fullmatch(r\"[1-9][0-9]{0,19}\", run_id) is not None and\n            re.fullmatch(r\"[1-9][0-9]{0,9}\", attempt) is not None,\n            \"run_linkage\")\n    require(re.fullmatch(r\"[0-9a-f]{40}\", head) is not None and\n            re.fullmatch(r\"[0-9a-f]{40}\", workflow_head) is not None,\n            \"head_linkage\")\n    require(os.environ.get(\"GITHUB_EVENT_NAME\") == \"push\" and\n            os.environ.get(\"GITHUB_REF\") ==\n            \"refs/heads/diag/web-image-metadata-20260924\", \"event_scope\")\n    linkage = dict(run_id=run_id, run_attempt=attempt,\n                   workflow_head=workflow_head, head=head)\n    emit(\"started\")\n\n    phase = \"anonymous_pull_auth\"\n    raw, headers = get(AUTH_URL, \"application/json\", body_limit=65536)\n    require(headers.get(\"content-type\", \"\").split(\";\", 1)[0].strip() ==\n            \"application/json\", \"auth_content_type\")\n    auth = parse_json(raw)\n    token = auth.get(\"token\", auth.get(\"access_token\"))\n    require(isinstance(token, str) and len(token) <= 16384 and\n            re.fullmatch(r\"[A-Za-z0-9._~+/\\-]+=*\", token) is not None,\n            \"auth_token_shape\")\n    require(\"token\" not in auth or \"access_token\" not in auth or\n            auth[\"token\"] == auth[\"access_token\"], \"ambiguous_auth_token\")\n    del auth, raw\n    emit(\"received\")\n\n    phase = \"index\"\n    raw, headers = get(TAG_URL, \", \".join(sorted(INDEX_TYPES)), token)\n    index, index_digest = manifest(raw, headers, INDEX_TYPES)\n    entries = index.get(\"manifests\")\n    require(isinstance(entries, list) and 0 < len(entries) <= 128,\n            \"index_manifest_list\")\n    candidates = []\n    for entry in entries:\n        descriptor(entry, MANIFEST_TYPES, BODY_LIMIT)\n        platform = entry.get(\"platform\")\n        require(isinstance(platform, dict), \"platform_shape\")\n        require(isinstance(platform.get(\"os\"), str) and platform[\"os\"] and\n                isinstance(platform.get(\"architecture\"), str) and\n                platform[\"architecture\"], \"platform_identity\")\n        if platform[\"os\"] == \"linux\" and platform[\"architecture\"] == \"amd64\":\n            candidates.append(entry)\n    require(len(candidates) == 1, \"linux_amd64_not_unique\")\n    selected = candidates[0]\n    selected_platform = selected[\"platform\"]\n    for field in (\"variant\", \"os.version\"):\n        if field in selected_platform:\n            require(isinstance(selected_platform[field], str),\n                    \"platform_constraint_type\")\n    for field in (\"os.features\", \"features\"):\n        if field in selected_platform:\n            require(isinstance(selected_platform[field], list) and\n                    all(isinstance(item, str) for item in selected_platform[field]),\n                    \"platform_constraint_type\")\n    require(selected_platform.get(\"variant\", \"\") == \"\" and\n            selected_platform.get(\"os.version\", \"\") == \"\" and\n            selected_platform.get(\"os.features\", []) == [] and\n            selected_platform.get(\"features\", []) == [], \"platform_constraint\")\n    index_identity = dict(digest=index_digest, size=len(raw),\n                          media_type=index[\"mediaType\"],\n                          byte_verification=\"sha256\",\n                          size_verification=(\"http_content_length\"\n                              if \"content-length\" in headers\n                              else \"bounded_count_no_parent_descriptor\"))\n    emit(\"verified\", index=index_identity)\n\n    phase = \"linux_amd64_child\"\n    raw, headers = get(REGISTRY + selected[\"digest\"],\n                       selected[\"mediaType\"], token)\n    del token\n    child, child_digest = manifest(raw, headers, MANIFEST_TYPES, selected)\n    require(\"manifests\" not in child and \"subject\" not in child and\n            \"artifactType\" not in child, \"not_image_manifest\")\n    config = descriptor(child.get(\"config\"), CONFIG_TYPES, BODY_LIMIT)\n    expected_config = (\"application/vnd.oci.image.config.v1+json\"\n                       if child[\"mediaType\"] ==\n                       \"application/vnd.oci.image.manifest.v1+json\"\n                       else \"application/vnd.docker.container.image.v1+json\")\n    require(config[\"mediaType\"] == expected_config, \"config_media_family\")\n    layers = child.get(\"layers\")\n    require(isinstance(layers, list) and 0 < len(layers) <= 128, \"layer_list\")\n    for layer in layers:\n        descriptor(layer, LAYER_TYPES, 1 << 40)\n    child_identity = dict(digest=child_digest, size=len(raw),\n                          media_type=child[\"mediaType\"],\n                          byte_verification=\"sha256_and_descriptor_size\")\n    config_identity = dict(digest=config[\"digest\"], size=config[\"size\"],\n                           media_type=config[\"mediaType\"],\n                           byte_verification=\"not_fetched\",\n                           version_metadata=\"not_inspected\",\n                           executed_version=\"not_executed\")\n    emit(\"verified\", child=child_identity)\n    phase = \"complete\"\n    emit(\"metadata_only_success\",\n         image=\"docker.io/library/node:22-bookworm-slim\",\n         platform=\"linux/amd64\", index=index_identity, child=child_identity,\n         config=config_identity, layer_fetches=0, redirects_followed=0,\n         sdk_tests=\"not_run\", delivery_validation=\"not_run\")\n\n\ntry:\n    signal.signal(signal.SIGALRM, expired)\n    signal.setitimer(signal.ITIMER_REAL, max(0.001, deadline - time.monotonic()))\n    main()\nexcept Rejected as failure:\n    emit(\"failed\", code=str(failure))\n    raise SystemExit(1) from None\nexcept BaseException:\n    # Never print exception text, auth responses, raw headers or transport traces.\n    emit(\"failed\", code=\"internal_error\")\n    raise SystemExit(1) from None\nfinally:\n    signal.setitimer(signal.ITIMER_REAL, 0)\nPY\n"
        }
      ]
    }
  }
}
