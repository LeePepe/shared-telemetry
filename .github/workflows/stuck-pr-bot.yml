name: stuck-PR bot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: read

jobs:
  report:
    uses: LeePepe/shared-ci/.github/workflows/stuck-pr-bot.yml@88c09b3f68ceea82a4ca979c689e3dc50266ee10
    with:
      failure-hours: 2
      open-hours: 24
