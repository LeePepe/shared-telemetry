# Repository-owned SwiftPM release adapter, based on shared-ci v0.6.0.
name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      release: ${{ steps.eligible.outputs.release }}
    env:
      CANDIDATE: ${{ github.event.workflow_run.head_sha }}
    steps:
      - id: candidate
        name: Admit the completed default-branch push
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$EVENT_NAME" != workflow_run ] || [ "$RUN_EVENT" != push ] ||
             [ "$RUN_RESULT" != success ] || [ -z "$REPOSITORY" ] ||
             [ "$RUN_REPOSITORY" != "$REPOSITORY" ] || [ -z "$DEFAULT_BRANCH" ] ||
             [ "$RUN_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo '::error::Release candidate is not a successful same-repository default-branch push.'
            exit 1
          fi
          printf 'candidate=%s\n' "$CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Checkout admitted candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        name: Resolve Swift checks and cumulative release content
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/release/prepare.py
      - id: eligible
        name: Bind checks and cumulative baseline to the current candidate
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECKED_SHA: ${{ steps.prepare.outputs.checked-sha }}
          REQUIRED_CHECKS: ${{ steps.prepare.outputs.required-checks }}
          BASELINE: ${{ steps.prepare.outputs.baseline }}
          PUBLISHABLE: ${{ steps.prepare.outputs.publishable }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] && [[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]] || fail 'Exact candidate and last successful release baseline required.'
          [ "$CHECKED_SHA" = "$CANDIDATE" ] && [ "$REQUIRED_CHECKS" = success ] || fail 'Necessary checks are missing, unsuccessful or for another candidate.'
          [ -n "$DEFAULT_BRANCH" ] &&
            [ "$(git rev-parse HEAD)" = "$CANDIDATE" ] &&
            [ "$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")" = "$CANDIDATE" ] || fail 'Candidate checkout is not the current default-branch tip.'
          git merge-base --is-ancestor "$BASELINE" "$CANDIDATE" || fail 'Release baseline is not an ancestor of the candidate.'
          case "$PUBLISHABLE" in
            true) [ "$BASELINE" != "$CANDIDATE" ] || fail 'No unreleased candidate range.' ;;
            false) ;;
            *) fail 'Cumulative release-content decision is missing or invalid.' ;;
          esac
          printf 'release=%s\n' "$PUBLISHABLE" >> "$GITHUB_OUTPUT"
  release:
    needs: admit
    if: needs.admit.outputs.release == 'true'
    concurrency:
      group: release-sdk
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      checks: read
      pull-requests: read
    env:
      CANDIDATE: ${{ needs.admit.outputs.candidate }}
    steps:
      - name: Checkout admitted candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        name: Revalidate after queue wait - Swift checks and cumulative release content
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/release/prepare.py
      - id: eligible
        name: Bind checks and cumulative baseline to the current candidate
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECKED_SHA: ${{ steps.prepare.outputs.checked-sha }}
          REQUIRED_CHECKS: ${{ steps.prepare.outputs.required-checks }}
          BASELINE: ${{ steps.prepare.outputs.baseline }}
          PUBLISHABLE: ${{ steps.prepare.outputs.publishable }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] && [[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]] || fail 'Exact candidate and last successful release baseline required.'
          [ "$CHECKED_SHA" = "$CANDIDATE" ] && [ "$REQUIRED_CHECKS" = success ] || fail 'Necessary checks are missing, unsuccessful or for another candidate.'
          [ -n "$DEFAULT_BRANCH" ] &&
            [ "$(git rev-parse HEAD)" = "$CANDIDATE" ] &&
            [ "$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")" = "$CANDIDATE" ] || fail 'Candidate checkout is not the current default-branch tip.'
          git merge-base --is-ancestor "$BASELINE" "$CANDIDATE" || fail 'Release baseline is not an ancestor of the candidate.'
          case "$PUBLISHABLE" in
            true) [ "$BASELINE" != "$CANDIDATE" ] || fail 'No unreleased candidate range.' ;;
            false) ;;
            *) fail 'Cumulative release-content decision is missing or invalid.' ;;
          esac
          printf 'release=%s\n' "$PUBLISHABLE" >> "$GITHUB_OUTPUT"
      - id: publish
        name: Publish and verify the immutable Swift tag
        if: steps.eligible.outputs.release == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: python3 scripts/release/publish.py
      - id: confirmed
        name: Confirm the Swift release result
        if: steps.eligible.outputs.release == 'true'
        shell: bash
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.published-sha }}
          VERIFIED_ARTIFACTS: ${{ steps.publish.outputs.verified-artifacts }}
        run: |
          if [ "$PUBLISHED_SHA" != "$CANDIDATE" ] || [ "$VERIFIED_ARTIFACTS" != success ]; then
            echo '::error::Swift tag publication is unconfirmed for this candidate.'
            exit 1
          fi
